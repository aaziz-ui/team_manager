{% extends "base.html" %}
{% block title %}Edit {{ project.name }}{% endblock %}
{% block content %}

<div class="card" style="max-width:600px">
  <div class="card-header"><h2>Edit project</h2></div>
  <form method="post" class="form-grid">
    <div class="span-2">
      <label>Project name</label>
      <input type="text" name="name" value="{{ project.name }}" required>
    </div>
    <div>
      <label>Client</label>
      <input type="text" name="client" value="{{ project.client or '' }}">
    </div>
    <div>
      <label>Project manager</label>
      <select name="manager_id">
        <option value="">— unassigned —</option>
        {% for m in all_possible_managers %}
        <option value="{{ m.id }}" {% if project.manager_id == m.id %}selected{% endif %}>{{ m.full_name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>Phase</label>
      <input type="text" name="phase" value="{{ project.phase or '' }}">
    </div>
    <div>
      <label>Status</label>
      <select name="status">
        {% for s in statuses %}
        <option value="{{ s }}" {% if project.status == s %}selected{% endif %}>{{ status_labels[s] }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label>Start date</label>
      <input type="date" name="start_date" value="{{ project.start_date.isoformat() if project.start_date else '' }}">
    </div>
    <div>
      <label>Target completion</label>
      <input type="date" name="target_date" value="{{ project.target_date.isoformat() if project.target_date else '' }}">
    </div>
    <div class="span-2">
      <label>Overall progress % <span class="muted small">(only used if no disciplines are tracked yet)</span></label>
      <input type="number" name="overall_progress" min="0" max="100" value="{{ project.overall_progress or 0 }}">
    </div>
    <div class="span-2">
      <label>Description</label>
      <textarea name="description" rows="3">{{ project.description or '' }}</textarea>
    </div>
    <div class="span-2"><button type="submit" class="btn btn-primary">Save changes</button></div>
  </form>

  {% if current_user.role == 'admin' %}
  <form method="post" action="{{ url_for('projects.archive', project_id=project.id) }}" style="margin-top:16px"
        onsubmit="return confirm('{{ 'Restore' if project.is_archived else 'Archive' }} this project?')">
    <button type="submit" class="btn btn-danger btn-sm">{{ 'Restore project' if project.is_archived else 'Archive project' }}</button>
  </form>
  {% endif %}
</div>
<a href="{{ url_for('projects.detail', project_id=project.id) }}" class="muted">&larr; back to project</a>
{% endblock %}
